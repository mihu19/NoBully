<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoBully — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07080f;
      --bg2:      #0d0f1c;
      --bg3:      #131626;
      --bg4:      #191c2e;
      --border:   #1e2438;
      --border2:  #252a40;
      --text:     #c8cfe8;
      --muted:    #424a66;
      --muted2:   #5c6585;
      --safe:     #00e87a;
      --warn:     #ffb020;
      --danger:   #ff3355;
      --accent:   #4f8dff;
      --font-h:   'Syne', sans-serif;
      --font-m:   'IBM Plex Mono', monospace;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-m);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ══════════════ LAYOUT ══════════════ */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-icon {
      width: 30px;
      height: 30px;
      background: var(--danger);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .nav-title {
      font-family: var(--font-h);
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .nav-title span { color: var(--danger); }

    .nav-sub {
      font-size: 10px;
      color: var(--muted2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: 2px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-pill {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      color: var(--muted2);
      background: var(--bg3);
      cursor: pointer;
      transition: 0.15s;
    }

    .nav-pill:hover { border-color: var(--accent); color: var(--accent); }

    .nav-pill.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Stats Row ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--card-accent, var(--border));
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: var(--font-h);
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .stat-value.colored { color: var(--card-accent, #fff); }

    .stat-delta {
      font-size: 10px;
      color: var(--muted2);
      margin-top: 6px;
    }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: var(--font-h);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .section-count {
      font-size: 11px;
      color: var(--muted2);
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-chip {
      font-family: var(--font-m);
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted2);
      background: transparent;
      cursor: pointer;
      transition: 0.15s;
    }

    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-chip.active.safe { background: var(--safe); border-color: var(--safe); }
    .filter-chip.active.warn { background: var(--warn); border-color: var(--warn); color: #000; }
    .filter-chip.active.danger { background: var(--danger); border-color: var(--danger); }

    /* ── History Table ── */
    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th {
      text-align: left;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 14px 10px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    .history-table tr.row {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      cursor: pointer;
    }

    .history-table tr.row:hover { background: var(--bg3); }

    .history-table td {
      padding: 12px 14px;
      vertical-align: middle;
    }

    .row-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .row-status-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .row-url {
      font-size: 12px;
      color: var(--text);
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-url small {
      display: block;
      font-size: 10px;
      color: var(--muted2);
      margin-top: 2px;
    }

    .score-bar-wrap {
      width: 80px;
    }

    .score-bar-label {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .score-bar-track {
      height: 4px;
      background: var(--bg4);
      border-radius: 2px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .row-words {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 200px;
    }

    .word-tag {
      font-size: 9px;
      background: rgba(255, 51, 85, 0.1);
      border: 1px solid rgba(255, 51, 85, 0.2);
      color: var(--danger);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .row-time {
      font-size: 10px;
      color: var(--muted2);
      white-space: nowrap;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon { font-size: 40px; }
    .empty-title { font-family: var(--font-h); font-size: 18px; color: var(--muted2); font-weight: 700; }
    .empty-sub { font-size: 11px; color: var(--muted); }

    /* ── Table wrapper ── */
    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 12px;
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Footer ── */
    footer {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      main { padding: 20px; }
      nav { padding: 0 20px; }
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
<div class="app">

  <!-- Nav -->
  <nav>
    <div class="nav-logo">
      <div class="nav-icon"><img src="icons/icon32.png" style="width:24px;height:24px;object-fit:contain;" /></div>
      <div>
        <div class="nav-title">No<span>Bully</span> <span style="font-size:13px;color:var(--muted2);font-family:var(--font-m);font-weight:400">/ dashboard</span></div>
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-pill" id="exportBtn">Export JSON</button>
      <button class="nav-pill danger" id="clearAllBtn">Clear All</button>
    </div>
  </nav>

  <main>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card" style="--card-accent: var(--accent)">
        <div class="stat-label">Pages Scanned</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-delta" id="statTotalSub">—</div>
      </div>
      <div class="stat-card" style="--card-accent: var(--danger)">
        <div class="stat-label">Blocked</div>
        <div class="stat-value colored" id="statBlocked">0</div>
        <div class="stat-delta" id="statBlockedPct">0% block rate</div>
      </div>
      <div class="stat-card" style="--card-accent: var(--warn)">
        <div class="stat-label">Avg Toxicity</div>
        <div class="stat-value colored" id="statAvgTox">0%</div>
        <div class="stat-delta">across all scans</div>
      </div>
      <div class="stat-card" style="--card-accent: var(--safe)">
        <div class="stat-label">Safe Pages</div>
        <div class="stat-value colored" id="statSafe">0</div>
        <div class="stat-delta" id="statSafePct">0% safe rate</div>
      </div>
    </div>

    <!-- History -->
    <div class="section-header">
      <div class="section-title">Analysis History</div>
      <div class="section-count" id="historyCount"></div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip danger" data-filter="blocked">Blocked</button>
      <button class="filter-chip warn" data-filter="caution">Caution</button>
      <button class="filter-chip safe" data-filter="safe">Safe</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div id="tableInner">
        <div class="empty-state">
          <div class="icon" style="font-size:32px;">⏳</div>
          <div class="empty-title">Loading history…</div>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <span>NoBully v1.0.0 — Content Safety Filter</span>
    <span id="footerTimestamp"></span>
  </footer>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="dashboard.js"></script>
</body>
</html>
