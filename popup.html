<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoBully</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07080f;
      --bg2:       #0e1120;
      --bg3:       #161928;
      --border:    #1e2438;
      --text:      #c8cfe8;
      --muted:     #4a5270;
      --safe:      #00e87a;
      --warn:      #ffb020;
      --danger:    #ff3355;
      --accent:    #4f8dff;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    html { width: 360px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      width: 360px;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      background: var(--danger);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: var(--font-head);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .logo-text span { color: var(--danger); }

    /* Toggle Switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: 0.25s;
    }

    .toggle-slider::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: var(--muted);
      border-radius: 50%;
      transition: 0.25s;
    }

    .toggle input:checked + .toggle-slider {
      background: rgba(0, 232, 122, 0.12);
      border-color: var(--safe);
    }

    .toggle input:checked + .toggle-slider::after {
      transform: translateX(16px);
      background: var(--safe);
    }

    /* ── Status Card ── */
    .status-card {
      margin: 14px 14px 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .status-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--status-color, var(--muted));
      transition: background 0.4s;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-color, var(--muted));
      box-shadow: 0 0 6px var(--status-color, transparent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text { color: var(--status-color, var(--muted)); }

    .page-url {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    /* ── Score Ring ── */
    .scores-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .ring-wrap svg { transform: rotate(-90deg); }

    .ring-track { fill: none; stroke: var(--bg3); stroke-width: 6; }

    .ring-fill {
      fill: none;
      stroke: var(--status-color, var(--muted));
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 188;
      stroke-dashoffset: 188;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                  stroke 0.4s;
    }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ring-pct {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .ring-sub {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* ── Stat Pills ── */
    .stats-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-pill {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-pill-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .stat-pill-val {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    /* ── Flagged Words ── */
    .flagged-section {
      margin: 10px 14px 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .section-title {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .flagged-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .flagged-tag {
      background: rgba(255, 51, 85, 0.1);
      border: 1px solid rgba(255, 51, 85, 0.25);
      color: var(--danger);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .no-flags {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Footer ── */
    .footer {
      margin: 12px 14px 14px;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 7px;
      border: none;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-ghost {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Loading / Idle states ── */
    .idle-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .idle-icon { font-size: 28px; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🛡</div>
      <div class="logo-text">No<span>Bully</span></div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="toggleLabel">ON</span>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <!-- Loading -->
  <div class="idle-state" id="loadingState">
    <div class="spinner"></div>
    <div>Fetching page status…</div>
  </div>

  <!-- No data -->
  <div class="idle-state hidden" id="idleState">
    <div class="idle-icon">🔍</div>
    <div>No analysis yet for this page.</div>
    <div style="font-size:10px;margin-top:2px;">Visit a page to start scanning.</div>
  </div>

  <!-- Results -->
  <div id="resultsView" class="hidden">
    <!-- Status Card -->
    <div class="status-card" id="statusCard">
      <div class="status-row">
        <div class="status-badge">
          <div class="status-dot" id="statusDot"></div>
          <span class="status-text" id="statusText">SAFE</span>
        </div>
        <div class="page-url" id="pageUrl"></div>
      </div>

      <div class="scores-row">
        <!-- Ring -->
        <div class="ring-wrap">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle class="ring-track" cx="36" cy="36" r="30" />
            <circle class="ring-fill" id="ringFill" cx="36" cy="36" r="30" />
          </svg>
          <div class="ring-label">
            <div class="ring-pct" id="ringPct">0%</div>
            <div class="ring-sub">TOXIC</div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-col">
          <div class="stat-pill">
            <span class="stat-pill-label">Severity</span>
            <span class="stat-pill-val" id="severityVal">—</span>
          </div>
          <div class="stat-pill">
            <span class="stat-pill-label">Bad Words</span>
            <span class="stat-pill-val" id="badWordVal">—</span>
          </div>
          <div class="stat-pill">
            <span class="stat-pill-label">Decision</span>
            <span class="stat-pill-val" id="decisionVal">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Flagged Words -->
    <div class="flagged-section">
      <div class="section-title">Flagged Content</div>
      <div class="flagged-tags" id="flaggedTags">
        <span class="no-flags">None detected</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn btn-ghost" id="clearBtn">Clear History</button>
      <button class="btn btn-primary" id="dashBtn">Open Dashboard</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
